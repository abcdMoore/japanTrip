<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="#0e0e0e"/>

  <!-- Torii gate — main structure in sakura pink -->
  <!-- Top curved beam (kasagi) -->
  <path d="M68 168 Q256 118 444 168 L444 196 Q256 146 68 196 Z" fill="#f4b8c4"/>
  <!-- Lower beam (nuki) -->
  <rect x="104" y="218" width="304" height="32" rx="7" fill="#f4b8c4"/>
  <!-- Left pillar -->
  <rect x="118" y="188" width="40" height="220" rx="10" fill="#f4b8c4"/>
  <!-- Right pillar -->
  <rect x="354" y="188" width="40" height="220" rx="10" fill="#f4b8c4"/>

  <!-- Cherry blossom — 5 petals, centred in the arch -->
  <g transform="translate(256,310)">
    <!-- Petal 1 (top) -->
    <ellipse cx="0" cy="-34" rx="14" ry="22" fill="#f9d0da" opacity="0.9"/>
    <!-- Petal 2 (upper-right) -->
    <ellipse cx="32" cy="-11" rx="14" ry="22" fill="#f9d0da" opacity="0.9" transform="rotate(72)"/>
    <!-- Petal 3 (lower-right) -->
    <ellipse cx="20" cy="28" rx="14" ry="22" fill="#f9d0da" opacity="0.9" transform="rotate(144)"/>
    <!-- Petal 4 (lower-left) -->
    <ellipse cx="-20" cy="28" rx="14" ry="22" fill="#f9d0da" opacity="0.9" transform="rotate(216)"/>
    <!-- Petal 5 (upper-left) -->
    <ellipse cx="-32" cy="-11" rx="14" ry="22" fill="#f9d0da" opacity="0.9" transform="rotate(288)"/>
    <!-- Centre -->
    <circle cx="0" cy="0" r="13" fill="#f4b8c4"/>
    <circle cx="0" cy="0" r="5"  fill="#d4889a"/>
  </g>
</svg>
